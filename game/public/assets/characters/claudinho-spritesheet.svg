  <rect x="38" y="66" width="12" height="16" fill="#26354d"/><rect x="54" y="66" width="12" height="16" fill="#1e2b40"/>
  <rect x="36" y="80" width="14" height="5" fill="#1e2b40"/><rect x="54" y="80" width="14" height="5" fill="#1e2b40"/>
  <rect x="32" y="84" width="18" height="5" fill="#e5e4dc"/><rect x="54" y="84" width="18" height="5" fill="#e5e4dc"/>
  <rect x="32" y="88" width="18" height="2" fill="#66717d"/><rect x="54" y="88" width="18" height="2" fill="#66717d"/>
 </g>
